<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moteur de Recherche NLP - Assurance</title>
    <!-- Inclusion de Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Carte Principale -->
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <h2 class="card-title fw-bold text-primary mb-3 text-center">
                            🔍 Recherche de Clauses d'Assurance
                        </h2>
                        <p class="text-muted text-center mb-4">
                            Saisissez un sinistre ou une situation pour trouver la clause correspondante.
                        </p>

                        <!-- Formulaire -->
                        <form method="POST" action="">
                            {% csrf_token %}
                            <div class="input-group mb-3">
                                <input type="text" 
                                       name="requete_texte" 
                                       class="form-control form-control-lg rounded-start-3" 
                                       placeholder="Ex: fuite d'eau, accident de voiture..." 
                                       value="{{ requete }}" 
                                       required>
                                <button class="btn btn-primary btn-lg px-4 rounded-end-3" type="submit">
                                    Rechercher
                                </button>
                            </div>
                        </form>

                        <!-- Section Résultat -->
                        {% if resultat %}
                            <hr class="my-4">
                            <div class="card bg-body-tertiary border-0 rounded-3 p-3">
                                <h5 class="fw-bold text-dark mb-2">Résultat trouvé :</h5>
                                <p class="mb-3 text-secondary fs-6">{{ resultat }}</p>
                                
                                <div class="d-flex align-items-center justify-content-between">
                                    <span class="small fw-semibold text-uppercase text-muted">Score de similarité</span>
                                    <span class="badge bg-success fs-6 px-3 py-2 rounded-pill">
                                        {{ score }}
                                    </span>
                                </div>
                            </div>
                        {% endif %}

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
